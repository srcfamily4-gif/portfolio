  <!-- 1. The New Heading at the Top -->

  <!-- Your existing portfolio content goes here -->

  <!-- 2. The Updated Random Fluctuation Script -->
  <script>
    // Tighter spread function: Generates a number between -1.8 and +2.1
    function getFluctuation() {
      const min = -1.8;
      const max = 2.1;
      return (Math.random() * (max - min) + min).toFixed(2);
    }
    
    // Example usage: You can apply this getFluctuation() value to your app's data logic
    console.log("Current Fluctuation:", getFluctuation() + "%");
  </script>

  <!-- 3. The Service Worker Registration (Kept clean at the very bottom) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
