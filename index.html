<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steven Curtis - Portfolio Tracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #f4f7f6;
      color: #333;
    }
    h1 {
      margin-bottom: 5px;
      color: #111;
      text-align: center;
    }
    .subtitle {
      color: #666;
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
      margin-bottom: 20px;
    }
    .total-section {
      text-align: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 20px;
      margin-bottom: 20px;
    }
    .label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
    }
    .balance {
      font-size: 2.8rem;
      font-weight: 800;
      margin: 10px 0;
      color: #111;
    }
    .fluctuation {
      font-size: 1.2rem;
      font-weight: 600;
    }
    .asset-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f9f9f9;
    }
    .asset-row:last-child {
      border-bottom: none;
    }
    .asset-info {
      display: flex;
      flex-direction: column;
    }
    .asset-ticker {
      font-weight: 700;
      font-size: 1.1rem;
    }
    .asset-allocation {
      font-size: 0.85rem;
      color: #666;
    }
    .asset-values {
      text-align: right;
    }
    .asset-price {
      font-weight: 600;
    }
    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }
    .btn {
      flex: 1;
      color: white;
      border: none;
      padding: 14px 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s;
      text-align: center;
    }
    .btn-buy {
      background: #00b074;
    }
    .btn-buy:hover {
      background: #008f5d;
    }
    .btn-sell {
      background: #ff3b30;
    }
    .btn-sell:hover {
      background: #d62f27;
    }
  </style>
</head>
<body>

  <h1>Steven Curtis</h1>
  <p class="subtitle">Live Asset Portfolio Tracker</p>

  <div class="card">
    <div class="total-section">
      <div class="label">Total Portfolio Balance</div>
      <div class="balance" id="total-balance">$88,745.40</div>
      <div class="fluctuation" id="total-fluctuation">0.00%</div>
    </div>

    <div class="label" style="margin-bottom: 10px;">Asset Allocation Breakdown</div>
    
    <div class="asset-row">
      <div class="asset-info">
        <span class="asset-ticker">SCHD</span>
        <span class="asset-allocation">Schwab U.S. Dividend Equity (51%)</span>
      </div>
      <div class="asset-values">
        <span class="asset-price" id="schd-val">$45,260.15</span>
      </div>
    </div>

    <div class="asset-row">
      <div class="asset-info">
        <span class="asset-ticker">SPYI</span>
        <span class="asset-allocation">NEOS S&P 500 High Income (28%)</span>
      </div>
      <div class="asset-values">
        <span class="asset-price" id="spyi-val">$24,848.71</span>
      </div>
    </div>

    <div class="asset-row">
      <div class="asset-info">
        <span class="asset-ticker">YTI</span>
        <span class="asset-allocation">YieldMax Target Income (21%)</span>
      </div>
      <div class="asset-values">
        <span class="asset-price" id="yti-val">$18,636.53</span>
      </div>
    </div>

    <!-- Replaced single button layout with Buy/Sell option rows -->
    <div class="btn-group">
      <button class="btn btn-buy" onclick="handleTransaction(500)">Buy $500</button>
      <button class="btn btn-sell" onclick="handleTransaction(-500)">Sell $500</button>
    </div>
  </div>

  <script>
    // Set dynamic tracking state using your exact base balances
    let currentTotal = 88745.40;

    function formatCurrency(num) {
      return '$' + num.toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,');
    }

    function handleTransaction(amount) {
      // Modify tracking asset base directly
      currentTotal += amount;
      if (currentTotal < 0) currentTotal = 0;

      // Generate random tight spread fluctuation constraint: -1.8% to +2.1%
      const min = -1.8;
      const max = 2.1;
      const changePercent = (Math.random() * (max - min) + min);
      const fluctuationMultiplier = 1 + (changePercent / 100);

      // Apply tighter random spread multiplier directly onto the adjusted balance
      const postMarketTotal = currentTotal * fluctuationMultiplier;

      // Dynamically calculate asset values using precise allocation tiers
      const newSCHD = postMarketTotal * 0.51;
      const newSPYI = postMarketTotal * 0.28;
      const newYTI = postMarketTotal * 0.21;

      // Update structural view tags
      document.getElementById('schd-val').textContent = formatCurrency(newSCHD);
      document.getElementById('spyi-val').textContent = formatCurrency(newSPYI);
      document.getElementById('yti-val').textContent = formatCurrency(newYTI);
      document.getElementById('total-balance').textContent = formatCurrency(postMarketTotal);

      // Render updated performance percentage indicators
      const flucDisplay = document.getElementById('total-fluctuation');
      flucDisplay.textContent = (changePercent >= 0 ? '+' : '') + changePercent.toFixed(2) + '%';
      flucDisplay.style.color = changePercent >= 0 ? '#00b074' : '#ff3b30';
    }
  </script>

  <!-- Clean Service Worker hook for offline WebAPK execution framework -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
